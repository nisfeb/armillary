# hoon-test-kit: what the Hoon suites build, and where it goes on the test
# desk. Sourced by bash and parsed by python, so plain KEY="value" lines only.
# Paths are relative to this file. See scripts/hoon-test-kit/README.md.

DESK=armillary-test

# the libs the suites cover. Each is import-free on purpose, so clay
# builds them as they are and each lands at lib/<name>.hoon
LIBS="code/lib/armillary.hoon code/lib/armillary-http.hoon code/lib/armillary-stripe.hoon code/lib/armillary-btcpay.hoon code/lib/armillary-openrouter.hoon"

# every *.hoon here lands in tests/lib/
TESTS=tests/lib

FILES=""

# marks copied from %base at setup: json builds through mime
MARKS="json mime"
